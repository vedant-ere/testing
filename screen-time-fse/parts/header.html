<!-- wp:group {"tagName":"header","className":"site-header","backgroundColor":"header-bg","layout":{"type":"default"}} -->
<header class="wp-block-group site-header has-header-bg-background-color has-background">

	<!-- ── Top Bar ───────────────────────────────────────────────────── -->
	<!-- wp:group {"className":"site-header__top-bar","layout":{"type":"constrained","contentSize":"1440px","justifyContent":"center"},"style":{"spacing":{"padding":{"top":"0","bottom":"0","left":"var:preset|spacing|16","right":"var:preset|spacing|16"}}}} -->
	<div class="wp-block-group site-header__top-bar">

		<!-- wp:group {"className":"site-header__top-inner","layout":{"type":"flex","justifyContent":"space-between","flexWrap":"nowrap","verticalAlignment":"center"}} -->
		<div class="wp-block-group site-header__top-inner">

			<!-- Search toggle (left) -->
			<!-- wp:html -->
			<button
				type="button"
				class="header-icon-button"
				id="header-search-toggle"
				aria-expanded="false"
				aria-controls="site-search-panel"
				aria-label="Search"
			>
				<span class="header-icon" aria-hidden="true">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
				</span>
				<span class="header-action-text">SEARCH</span>
			</button>
			<!-- /wp:html -->

			<!-- Logo (centre) — customizable via WordPress Customizer -->
			<!-- wp:site-logo {"width":120,"shouldSyncIcon":false,"className":"site-logo"} /-->

			<!-- Desktop actions + mobile hamburger (right) -->
			<!-- wp:group {"className":"site-header__actions","layout":{"type":"flex","flexWrap":"nowrap","verticalAlignment":"center","justifyContent":"right"},"style":{"spacing":{"blockGap":"var:preset|spacing|24"}}} -->
			<div class="wp-block-group site-header__actions">

				<!-- Sign In (hidden on mobile via CSS) -->
				<!-- wp:html -->
				<a href="/wp-login.php" class="header-action-link desktop-only" aria-label="Sign In">
					<svg class="header-user-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
					<span class="header-action-text">SIGN IN</span>
				</a>
				<!-- /wp:html -->

				<!-- Language dropdown (hidden on mobile via CSS) -->
				<!-- wp:html -->
				<div class="header-language-wrap desktop-only">
					<button
						type="button"
						class="header-language"
						id="header-language-toggle"
						aria-expanded="false"
						aria-controls="header-language-menu"
						aria-label="Select language"
					>
						<span data-language-current>ENG</span> <span aria-hidden="true">▼</span>
					</button>
					<ul id="header-language-menu" class="header-language-menu" data-language-menu hidden role="menu" aria-label="Language options">
						<li role="none"><button type="button" role="menuitem" data-language-option data-language-code="ENG">English</button></li>
						<li role="none"><button type="button" role="menuitem" data-language-option data-language-code="HIN">Hindi</button></li>
						<li role="none"><button type="button" role="menuitem" data-language-option data-language-code="SPA">Spanish</button></li>
					</ul>
				</div>
				<!-- /wp:html -->

				<!-- Mobile hamburger (hidden on desktop via CSS) -->
				<!-- wp:html -->
				<button
					type="button"
					class="header-menu-toggle mobile-only"
					id="mobile-menu-toggle"
					aria-expanded="false"
					aria-controls="mobile-menu-panel"
					aria-label="Open menu"
				>
					<span class="header-icon" aria-hidden="true">
						<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
					</span>
					<span class="sr-only">Open menu</span>
				</button>
				<!-- /wp:html -->

			</div>
			<!-- /wp:group -->

		</div>
		<!-- /wp:group -->

	</div>
	<!-- /wp:group -->

	<!-- ── Search Panel ──────────────────────────────────────────────── -->
	<!-- wp:html -->
	<div id="site-search-panel" class="site-search-panel" hidden>
		<div class="site-search-inner">
			<form class="site-search-form" action="/" method="get">
				<label for="site-search-input" class="sr-only">Search for:</label>
				<input
					id="site-search-input"
					type="search"
					name="s"
					placeholder="Search movies, people…"
					autocomplete="off"
				>
				<button type="submit" aria-label="Submit search">
					<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
				</button>
			</form>
		</div>
	</div>
	<!-- /wp:html -->

	<!-- ── Desktop Navigation Bar ────────────────────────────────────── -->
	<!-- wp:group {"className":"site-header__nav-bar","backgroundColor":"nav-bg","layout":{"type":"constrained","contentSize":"1440px","justifyContent":"center"},"style":{"spacing":{"padding":{"top":"0","bottom":"0","left":"var:preset|spacing|16","right":"var:preset|spacing|16"}}}} -->
	<div class="wp-block-group site-header__nav-bar has-nav-bg-background-color has-background">

		<!-- wp:navigation {"ref":null,"overlayMenu":"never","className":"site-nav","textColor":"text-primary","layout":{"type":"flex","justifyContent":"center","flexWrap":"nowrap"},"style":{"typography":{"textTransform":"uppercase","fontSize":"var(--wp--preset--font-size--sm)"},"spacing":{"blockGap":"var:preset|spacing|32"}}} -->
		<nav class="wp-block-navigation site-nav has-text-primary-color has-text-color">
			<!-- wp:navigation-link {"label":"MOVIES","url":"#","kind":"custom"} /-->
			<!-- wp:navigation-link {"label":"TV SHOWS","url":"#","kind":"custom"} /-->
			<!-- wp:navigation-link {"label":"EVENTS","url":"#","kind":"custom"} /-->
			<!-- wp:navigation-link {"label":"THEATRE","url":"#","kind":"custom"} /-->
			<!-- wp:navigation-link {"label":"CELEBRITIES","url":"#","kind":"custom"} /-->
		</nav>
		<!-- /wp:navigation -->

	</div>
	<!-- /wp:group -->

	<!-- ── Mobile Menu Panel ─────────────────────────────────────────── -->
	<!-- wp:html -->
	<div
		id="mobile-menu-panel"
		class="mobile-menu"
		hidden
		aria-hidden="true"
		role="dialog"
		aria-label="Mobile navigation"
		aria-modal="true"
	>
		<div class="mobile-menu__panel">

			<!-- Mobile menu top bar -->
			<div class="mobile-menu__top">
				<button
					type="button"
					class="header-icon-button"
					id="mobile-search-toggle"
					aria-label="Search"
				>
					<span class="header-icon" aria-hidden="true">
						<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
					</span>
				</button>

				<a class="site-logo site-logo--mobile" href="/" rel="home" aria-label="Screen Time Home">
					<span class="site-logo__screen">SCREEN</span><span class="site-logo__time">TIME</span>
				</a>

				<button
					type="button"
					class="header-icon-button mobile-menu__close"
					id="mobile-menu-close"
					aria-label="Close menu"
				>
					<span class="header-icon" aria-hidden="true">
						<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
					</span>
					<span class="sr-only">Close menu</span>
				</button>
			</div>

			<!-- Mobile navigation - excludes Explore and Settings per spec -->
			<nav class="mobile-menu__nav" aria-label="Mobile navigation">
				<ul class="mobile-menu__list" id="mobile-menu-list">
					<li><a href="#" class="mobile-menu__link">MOVIES</a></li>
					<li><a href="#" class="mobile-menu__link">TV SHOWS</a></li>
					<li><a href="#" class="mobile-menu__link">EVENTS</a></li>
					<li><a href="#" class="mobile-menu__link">THEATRE</a></li>
					<li><a href="#" class="mobile-menu__link">CELEBRITIES</a></li>
				</ul>
			</nav>

		</div>
	</div>
	<!-- /wp:html -->

</header>
<!-- /wp:group -->
